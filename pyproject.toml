[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "strata-control-lab"
version = "0.1.0"
description = "An offline-first visual laboratory for logprobs, grammar and model control"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "fastapi==0.142.2",
  "uvicorn==0.54.0",
  "httpx==0.28.1",
  "chess==1.11.2",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "playwright==1.63.0", "build>=1.2,<2"]

[project.scripts]
strata-control-lab = "control_lab.__main__:main"

[tool.setuptools.packages.find]
include = ["control_lab*"]

[tool.setuptools]
include-package-data = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
